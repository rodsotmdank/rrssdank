<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario Campaña DANK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: cabecera con avance, calendario de 4 semanas, y fichas de publicación de la semana activa (texto + selector de producto al lado). */
:root{
  --bg:#f3f7fc; --surface:#ffffff; --surface2:#e6eef8; --ink:#0f2540; --muted:#4f6279; --line:#d0dbe8;
  --accent:#0b3d7a; --accent-ink:#ffffff; --warm:#e8731a;
  --li:#0a66c2; --ig:#c25a0a;
  --airscrape:#d9640f; --rosta:#1f5fae; --ambos:#0b3d7a;
  --st-pend:#6b7c93; --st-borr:#d9710f; --st-apro:#1f5fae; --st-publ:#1f8a4c;
  --danger:#b3261e;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1727; --surface:#12233a; --surface2:#1a2f4b; --ink:#e8f0fa; --muted:#9db0c8; --line:#243a58;
  --accent:#5aa0f0; --accent-ink:#08121f; --warm:#f5a05a;
  --li:#6fb0ff; --ig:#f59a4d;
  --airscrape:#f5a05a; --rosta:#6fa8ff; --ambos:#a9c4f0;
  --st-pend:#9db0c8; --st-borr:#f5a05a; --st-apro:#6fa8ff; --st-publ:#4cc27f;
  --danger:#f08a83; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1727; --surface:#12233a; --surface2:#1a2f4b; --ink:#e8f0fa; --muted:#9db0c8; --line:#243a58;
  --accent:#5aa0f0; --accent-ink:#08121f; --warm:#f5a05a;
  --li:#6fb0ff; --ig:#f59a4d;
  --airscrape:#f5a05a; --rosta:#6fa8ff; --ambos:#a9c4f0;
  --st-pend:#9db0c8; --st-borr:#f5a05a; --st-apro:#6fa8ff; --st-publ:#4cc27f;
  --danger:#f08a83; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.15;letter-spacing:-.01em}
h2{font-size:18px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.top .lead{min-width:0;flex:1 1 320px;display:flex;flex-direction:column;gap:6px}
.top p{margin:0;color:var(--muted);max-width:60ch}
.sync{font-size:12px;color:var(--muted)}
.progress{flex:1 1 320px;max-width:460px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:132px repeat(7,minmax(112px,1fr));min-width:920px}
.cal>div{padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:64px}
.cal>div:nth-child(8n){border-right:0}
.cal .h{min-height:0;background:var(--surface2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal .wk{display:flex;flex-direction:column;gap:2px;background:none;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;padding:8px;border-radius:0}
.cal .wk strong{font-family:var(--font-head);font-size:14px}
.cal .wk span{font-size:11px;color:var(--muted);line-height:1.3}
.cal .wk.on{background:var(--surface2)}
.cal .wk.on strong{color:var(--accent)}
.cal .day{display:flex;flex-direction:column;gap:4px}
.cal .day .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .day.today .n{color:var(--accent);font-weight:700}
.chip{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.3;min-width:0}
.chip:hover{border-color:var(--accent)}
.caltools{display:flex;justify-content:flex-end;margin:0 0 6px}
.caltools .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.printhead{display:none}
@media print{
@page{size:A4 landscape;margin:10mm}
body.pcal>*:not(#printroot){display:none!important}
html,body.pcal{background:#fff!important}
body.pcal #printroot{zoom:.78;display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printroot .printhead{display:block;margin-bottom:8px}
#printroot .printhead h1{font-size:16px;margin:0 0 2px}
#printroot .printhead .lg{display:flex;gap:14px;font-size:11px;margin-top:4px}
#printroot .printhead .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#printroot .chip .tx{-webkit-line-clamp:unset;display:block}
#printroot .chip,#printroot .day,#printroot .wk{break-inside:avoid}
}
#printroot{display:none}
.lockmsg{font-size:12px;font-weight:600;color:var(--st-publ);background:rgba(31,138,76,.12);border-radius:6px;padding:4px 8px;margin-bottom:6px}
.slot textarea[readonly]{opacity:.8;cursor:not-allowed;background:var(--surface2)}
.slot .btn:disabled{opacity:.45;cursor:not-allowed}
.chip.pub{background:#d4f0de;border-color:var(--st-publ);color:#0d3b20}.chip.pub .pr{filter:brightness(.7)}
html[data-theme="dark"] .chip.pub{background:#1c4a31;border-color:var(--st-publ);color:#e6f7ee}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .chip.pub{background:#1c4a31;color:#e6f7ee}}
.chip .pl{font-weight:700;color:#fff;border-radius:3px;padding:0 4px;font-size:10px;flex:none}
.chip .pl.li{background:var(--li)} .chip .pl.ig{background:var(--ig)}
html[data-theme="dark"] .chip .pl{color:#10181a}
.chip .txw{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.chip .pr{font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.chip .tx{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;min-width:0}
.chip{align-items:flex-start}.chip .st{margin-top:3px}.chip .pl{margin-top:1px}
.chip .st{width:8px;height:8px;border-radius:50%;flex:none}

.weeknav{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.weeknav .info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 320px}
.weeknav p{margin:0;color:var(--muted);max-width:68ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.slots{display:flex;flex-direction:column;gap:16px}
.slot{display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:16px}
.slot.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.meta{padding:16px;border-right:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px;min-width:0}
.meta .date{font-family:var(--font-head);font-weight:700;font-size:18px;text-transform:capitalize}
.meta .time{font-size:12px;color:var(--muted)}
.plat{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;color:#fff;border-radius:4px;padding:2px 8px}
.plat.li{background:var(--li)} .plat.ig{background:var(--ig)}
html[data-theme="dark"] .plat{color:#10181a}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .plat,html:not([data-theme="light"]) .chip .pl{color:#10181a}}
.meta .kv{font-size:12px;color:var(--muted)} .meta .kv b{color:var(--ink);font-weight:600}
.late{font-size:12px;font-weight:600;color:var(--danger)}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field legend{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.main{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.compose{display:flex;flex-direction:column;gap:14px}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;resize:vertical;min-height:230px;line-height:1.55}
.compose .field{min-width:0}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;font-weight:400}
.count.over{color:var(--danger);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
fieldset.prod{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-weight:500}
.opt .sw{width:10px;height:10px;border-radius:50%;flex:none}
.opt input:checked+span{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface2)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
details.cco{border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
details.cco summary{cursor:pointer;font-weight:600;font-size:13px}
details.cco .in{display:flex;flex-direction:column;gap:10px;margin-top:10px}
details.cco textarea{min-height:100px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}

details.settings{padding:0}
details.settings>summary{padding:14px 16px;cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:16px}
.tagst{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:1px 10px}
.tagst i{width:8px;height:8px;border-radius:50%;background:var(--c)}
fieldset.stf{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.exp{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.exp .btn{display:inline-flex;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
details.chkl{border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
details.chkl summary{cursor:pointer;font-weight:600;font-size:13px}
details.chkl .in{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:14px}
.kpi h2{margin:0}
.kpi-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi-sum .m{display:flex;flex-direction:column;gap:6px}
.kpi-sum .big{font-family:var(--font-head);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-sum .big small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi-sum .bar{height:8px}
.kpi-tbl{overflow-x:auto}
.kpi-tbl table{border-collapse:collapse;width:100%;min-width:420px}
.kpi-tbl th,.kpi-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.kpi-tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi-tbl input{width:84px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-variant-numeric:tabular-nums}
.set-grid{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.set-grid section{display:flex;flex-direction:column;gap:10px;min-width:0}
.set-grid textarea{min-height:68px}
.warn{font-size:12px;color:var(--st-borr);background:var(--surface2);border-radius:6px;padding:8px 10px}
@media (max-width:760px){
  .slot{grid-template-columns:minmax(0,1fr)}
  .meta{border-right:0;border-bottom:1px solid var(--line)}
  .compose{grid-template-columns:minmax(0,1fr)}
  fieldset.prod{flex-direction:row;flex-wrap:wrap}
  fieldset.prod .opt{flex:1 1 90px}
}
@media (prefers-reduced-motion:no-preference){.slot{transition:box-shadow .2s,border-color .2s}}

.vtabs{margin-right:8px}
textarea.ttl{min-height:64px;font-weight:600;font-size:15px}
.hdr{display:flex;align-items:center;gap:10px}
.hd .btn{padding:3px 10px;font-size:12px}
details.srcd{border:1px solid var(--warm);border-radius:8px;padding:8px 12px;background:var(--surface)}
details.srcd summary{cursor:pointer;font-weight:600;font-size:13px}
details.srcd .in{display:flex;flex-direction:column;gap:12px;margin-top:10px}
details.srcd .hint{margin:0}
details.srcd textarea{min-height:84px;font-size:13px;padding:6px 8px}
details.srcd .use{font-size:12px;color:var(--muted)}
.top{border-top:4px solid var(--warm);padding-top:14px}
.eyebrow{color:var(--warm)}
.fechas{display:flex;flex-direction:column;gap:12px}
.fechas .fhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fechas h2{font-family:var(--font-head);font-size:18px;margin:0}
.fadd{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.fadd label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.fadd input{width:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.fcard{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard.near{border-color:var(--warm)}
.fcard .ft{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fcard h3{margin:0;font-family:var(--font-head);font-size:15px}
.fcard .fd{font-size:12px;color:var(--muted)}
.fcount{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.fcount.near{border-color:var(--warm);color:var(--warm)}
.fcount.hoy{background:var(--warm);border-color:var(--warm);color:#fff}
.fcard textarea{min-height:260px}
.fbadge{margin-left:6px;font-size:11px;font-weight:700;color:var(--warm)}
.fcard .ft{cursor:pointer;align-items:center;flex-wrap:wrap;gap:6px 10px}
.fcard .ft>div:first-child{flex:1 1 150px;min-width:0}
.fgrid{align-items:start}
.fcard .ft:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.fcard .fr{display:flex;align-items:center;gap:8px}
.fcard .fst{font-size:11px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fcard .fst i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fcard .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin:0 4px 3px 2px}
.fcard.open .chev{transform:rotate(-135deg);margin-top:5px}
.fcard .fbody{display:flex;flex-direction:column;gap:8px}
.fcard .fbody[hidden]{display:none}
.fhead .fbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.charts{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;padding:16px;align-items:center}
.charts h2{font-family:var(--font-head);font-size:16px;margin:0 0 2px}
.charts .cwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.charts .donut{width:150px;height:150px;flex:none}
.charts .donut text{fill:var(--text,currentColor);font-family:var(--font-head)}
.charts .cleg{display:flex;flex-direction:column;gap:6px;font-size:13px}
.charts .cleg span{display:flex;align-items:center;gap:6px}
.charts .cleg .dot{width:10px;height:10px;border-radius:50%;flex:none}
.charts .wk{display:flex;flex-direction:column;gap:8px;min-width:0}
.charts .wrow{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.charts .wbar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.charts .wbar i{display:block;height:100%}
.charts .wrow b{font-variant-numeric:tabular-nums;text-align:right}
@media(max-width:760px){.charts{grid-template-columns:1fr}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
.wrap{padding:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.userbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.userbar button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.pdfbox{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pdfbox .pt{font-size:13px;font-weight:600}
.pdfl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pdfl li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px}
.pdfl a{color:var(--accent);font-weight:600;word-break:break-all}
.filebtn{cursor:pointer;display:inline-flex;align-items:center}
.pdfb{font-size:9px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--muted);margin-left:4px;align-self:flex-start}
.brand img{height:44px;width:auto;background:#fff;border-radius:8px;padding:4px 10px}
.wsel{width:auto;display:inline-block;font:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);border:1px solid var(--warm);border-radius:6px;background:var(--surface);padding:1px 4px}
.mesa{display:flex;flex-direction:column;gap:14px}
.mesa h2{font-family:var(--font-head);font-size:18px;margin:0}
.mesa .sub{color:var(--muted);margin:0;max-width:70ch}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mix .panel>span:not(.hint){white-space:nowrap}
.mix>div{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mix b{font-variant-numeric:tabular-nums}
.metain{width:56px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px;font-weight:600;font-variant-numeric:tabular-nums}
.mixbox{cursor:pointer}.mixbox:hover{border-color:var(--accent)}.mixbox.on{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm)}
.mixdef{font-size:12px;line-height:1.4;white-space:normal;flex:1}
.mixbtn{border:0;background:none;padding:0;text-align:left;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.mixbox.on .mixbtn{color:var(--ink);font-weight:600}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface2);border-radius:8px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px}
.pager .btn:disabled{opacity:.45;cursor:default}
.mix .bar2{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.mix .bar2 i{display:block;height:100%;background:var(--accent)}
.mrow{display:grid;grid-template-columns:130px 110px 130px 140px minmax(0,1.6fr) 130px 130px auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mrow label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:600;min-width:0}
.mrow textarea,.mrow input,.mrow select{font-size:13px;font-weight:400;color:var(--ink)}
.mrow textarea{min-height:56px;padding:6px 8px;border-radius:6px}
.mrow .notes{grid-column:1/-1}
.mrow.desc{opacity:.55}
.meet{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,2fr) auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.meet label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.meet textarea{min-height:70px;padding:6px 8px;border-radius:6px;font-size:13px;font-weight:400;color:var(--ink)}
@media (max-width:900px){.mrow{grid-template-columns:1fr 1fr}.mrow .notes{grid-column:1/-1}.meet{grid-template-columns:1fr}}
</style>
</head>

let serverVersion=0,timer=null,saving=false,pendingSave=false,PDFS={},UP={},pdfSig='';
function setSync(t){const e=document.getElementById('sync');if(e)e.textContent=t;}
const horaAhora=()=>new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
function save(){
  clearTimeout(timer);setSync('Guardando…');
  timer=setTimeout(()=>{timer=null;doSave();},600);
}
async function doSave(){
  if(saving){pendingSave=true;return;}
  saving=true;
  try{
    const snap=JSON.parse(JSON.stringify(S));
    const r=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({data:snap,baseVersion:serverVersion})});
    if(r.status===401){location.href='/login';return;}
    const j=await r.json().catch(()=>({}));
    if(r.ok){serverVersion=j.version;setSync('Guardado '+horaAhora()+'.');}
    else if(r.status===409&&j.current){
      serverVersion=j.current.version;applyRemote(j.current.data);
      setSync('Otra persona guardó cambios al mismo tiempo'+(j.current.updated_by_email?' ('+j.current.updated_by_email+')':'')+'. Se cargó la versión más reciente; revisa tu último cambio.');
    }else setSync('No se pudo guardar'+(j.error?' ('+j.error+')':'')+'. Se reintentará.');
    if(!r.ok&&r.status!==409)setTimeout(save,5000);
  }catch(e){setSync('Sin conexión. Se reintentará en unos segundos.');setTimeout(save,5000);}
  finally{saving=false;if(pendingSave){pendingSave=false;doSave();}}
}
async function loadPdfs(){

    const sig=JSON.stringify(g);if(sig===pdfSig)return false;
    pdfSig=sig;PDFS=g;return true;
  }catch(e){return false;}
}

async function uploadPdf(id,file){
  if(!file)return;
  if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){pdfMsg(id,'Elige un archivo PDF.');return;}
  if(file.size>50*1024*1024){pdfMsg(id,'El PDF supera los 50 MB.');return;}
  try{
    pdfMsg(id,'Preparando subida…');
    const r1=await fetch('/api/pdfs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'sign',slot_id:id,filename:file.name,size:file.size})});
    if(r1.status===401){location.href='/login';return;}
    const j1=await r1.json();if(!r1.ok)throw new Error(j1.error||'No se pudo preparar la subida');
    pdfMsg(id,'Subiendo '+file.name+'…');
    const fd=new FormData();fd.append('cacheControl','3600');fd.append('',file);
    const r2=await fetch(j1.signedUrl,{method:'PUT',headers:{'x-upsert':'false'},body:fd});
    if(!r2.ok)throw new Error('Falló la subida del archivo ('+r2.status+')');
    const r3=await fetch('/api/pdfs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'confirm',slot_id:id,path:j1.path,filename:file.name,size:file.size})});
    const j3=await r3.json();if(!r3.ok)throw new Error(j3.error||'No se pudo registrar el PDF');
    (PDFS[id]=PDFS[id]||[]).unshift(j3.pdf);pdfSig=JSON.stringify(PDFS);
    UP[id]='';renderAll();
    const e=document.getElementById('pdfmsg-'+id);if(e)e.textContent='PDF subido.';
  }catch(e){pdfMsg(id,'No se pudo subir: '+(e&&e.message?e.message:'error')+'.');}
}

async function buildXlsx(){
  const wb=new ExcelJS.Workbook();wb.creator='DANK';wb.created=new Date();
  const ws=wb.addWorksheet('Calendario',{views:[{state:'frozen',xSplit:3,ySplit:1}]});
  const cols=[['Semana','w',9],['Fase','fase',26],['Fecha','fecha',12],['Día','dia',11],['Hora (Chile)','hora',13],['Red','red',11],['Cuenta','cuenta',14],['Producto','prod',12],['Tipo de publicación','tipo',24],['Audiencia','aud',18],['Ángulo','ang',26],['Formato sugerido','fmt',26],['Idea visual','vis',34],['Estado','est',14],['Texto de la publicación','txt',80],['Caracteres','n',11],['Comentario repost CCO','cco',60],['Repost CCO realizado','ccod',14],['Checklist','chk',11]];
  ws.columns=cols.map(c=>({header:c[0],key:c[1],width:c[2]}));
  const hr=ws.getRow(1);hr.height=30;
  hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B3D7A'}};c.alignment={vertical:'middle',wrapText:true};});
  const rows=slotRows();
  rows.forEach((r,i)=>{
    const row=ws.addRow(r.row);const lines=r.row.txt.split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/88)),0);
    const l2=r.row.cco?r.row.cco.split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/62)),0):0;
    row.height=Math.min(409,Math.max(48,15*Math.max(lines,l2)+8));
    row.eachCell(c=>{c.alignment={vertical:'top',wrapText:true};c.border={bottom:{style:'thin',color:{argb:'FFD9DFDD'}}};});
    row.getCell('fecha').numFmt='dd-mm-yyyy';
    const ec=row.getCell('est');ec.fill={type:'pattern',pattern:'solid',fgColor:{argb:EST_FILL[r.s.status]}};ec.font={bold:true};
    ec.dataValidation={type:'list',allowBlank:false,formulae:['"No iniciada,En proceso,Publicada"']};
  });
  ws.autoFilter={from:{row:1,column:1},to:{row:rows.length+1,column:cols.length}};
  const rs=wb.addWorksheet('Resumen');
  rs.columns=[{width:38},{width:16},{width:16},{width:16},{width:16}];
  const hd=(r)=>r.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B3D7A'}};});
  rs.addRow(['Calendario de publicaciones · Campaña Airscrape y Rosta']).font={bold:true,size:14};
  rs.addRow(['Generado el '+new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})+'. Horarios en hora de Chile.']);
  rs.addRow([]);hd(rs.addRow(['Estado','Publicaciones']));
  const cnt={noiniciada:0,enproceso:0,publicada:0};rows.forEach(r=>cnt[r.s.status]++);
  Object.keys(STATUS).forEach(k=>{const r=rs.addRow([STATUS[k][0],cnt[k]]);r.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:EST_FILL[k]}};});
  rs.addRow(['Total',rows.length]).font={bold:true};
  rs.addRow([]);hd(rs.addRow(['Red','Publicaciones','Publicadas']));
  ['li','ig'].forEach(k=>{const l=rows.filter(r=>r.sl.pl===k);rs.addRow([PLAT[k].name,l.length,l.filter(r=>r.s.status==='publicada').length]);});
  return wb.xlsx.writeBuffer();
}
async function exportExcel(){

 {id:'anio',n:'Año Nuevo',m:1,d:1,tag:'#AñoNuevo',v:['Comienza un nuevo año y queremos empezar agradeciéndote.\n\nGracias por la confianza y por el trabajo en conjunto. Cada conversación, cada visita a terreno y cada proyecto nos ayudó a entender mejor lo que necesita tu operación y a mejorar la forma en que te acompañamos.\n\nSabemos que detrás de cada equipo funcionando hay personas que planifican, mantienen y cuidan los detalles todos los días. Ese trabajo es el que hace posible que las operaciones sigan avanzando.\n\nQue este nuevo año traiga metas cumplidas, operaciones continuas, pocas detenciones inesperadas y tiempo para lo que más importa.\n\nEstamos disponibles para acompañarte en lo que viene.\n\nFeliz Año Nuevo.',
  'Termina un año de mucho trabajo y empieza uno nuevo.\n\nEn DANK queremos saludar a las personas, los equipos y las empresas con las que trabajamos. Gracias por abrir las puertas de tus operaciones, por contarnos lo que necesitas y por confiar en nuestro equipo técnico.\n\nUn nuevo año es una buena ocasión para mirar lo que viene: nuevos desafíos, nuevas metas y también la oportunidad de hacer las cosas mejor. Seguiremos acompañándote con evaluación en terreno, selección de la solución adecuada y puesta en marcha a cargo de nuestro equipo.\n\nQue este año tengas buenos resultados, turnos seguros y equipos funcionando como corresponde.\n\nFeliz Año Nuevo.',
  'Un nuevo año es una buena ocasión para detenerse un momento y agradecer.\n\nDesde DANK te agradecemos por ser parte de nuestro camino. Trabajar con operaciones mineras e industriales nos exige estar cerca de quienes las hacen funcionar, y esa cercanía es lo que más valoramos.\n\nEste año queremos seguir conversando contigo sobre lo que pasa en terreno: las vibraciones, el polvo, las correas que patinan y las detenciones que nadie quiere. Cada problema que nos cuentas es una oportunidad para buscar una mejor solución.\n\nTe deseamos un año de metas cumplidas, de trabajo seguro y de operaciones más continuas.\n\nAquí estamos para acompañarte.\n\nFeliz Año Nuevo.']},
 {id:'mujer',n:'Día Internacional de la Mujer',m:3,d:8,tag:'#DíaDeLaMujer',v:['Hoy, 8 de marzo, es el Día Internacional de la Mujer.\n\nQueremos reconocer a las mujeres que trabajan en la minería y en la industria: en las faenas, en los talleres, en las oficinas, en la ingeniería, en la operación y en la mantención. Cada una de ellas aporta con su preparación, su esfuerzo y su compromiso.\n\nLa continuidad de una operación depende de muchas personas, y las mujeres son una parte fundamental de ese trabajo todos los días.\n\nSabemos que todavía hay camino por recorrer para que haya más espacios y más oportunidades. Por eso es importante seguir hablando de ello y seguir reconociendo su aporte.\n\nGracias por abrir camino y por inspirar a quienes vienen después.\n\nFeliz Día de la Mujer.',
  'En el Día Internacional de la Mujer queremos saludar a todas las mujeres que forman parte de la minería y de la industria.\n\nDetrás de cada operación hay mujeres que planifican, operan, supervisan, mantienen y toman decisiones. Su trabajo muchas veces no se ve, pero se nota en cada turno que sale bien y en cada equipo que sigue funcionando.\n\nEn DANK trabajamos con empresas y equipos de la minería y la industria, y sabemos lo importante que es el aporte de cada persona. Por eso hoy queremos reconocer y agradecer a quienes, con su esfuerzo diario, hacen posible que las operaciones avancen.\n\nQue este día sea una buena ocasión para valorar su trabajo, escuchar sus ideas y seguir construyendo una industria donde todas puedan crecer.\n\nFeliz Día de la Mujer.',
  'Cada operación funciona gracias a las personas que la hacen posible, y muchas de ellas son mujeres.\n\nHoy, Día Internacional de la Mujer, las saludamos y reconocemos su trabajo en la minería y en la industria. Su aporte está en cada área: en terreno, en el taller, en la oficina, en la gestión y en la toma de decisiones.\n\nCuando una operación se mantiene continua, detrás hay muchas horas de planificación, de revisión y de trabajo en equipo. Y en ese trabajo, las mujeres tienen un rol que merece ser reconocido.\n\nQue cada vez haya más espacios para que sigan creciendo, aprendiendo y liderando.\n\nGracias por todo lo que aportan cada día.\n\nFeliz Día de la Mujer.']},
 {id:'seg',n:'Día Mundial de la Seguridad y Salud en el Trabajo',m:4,d:28,tag:'#SeguridadYSalud',v:['Hoy es el Día Mundial de la Seguridad y Salud en el Trabajo.\n\nCuidarse es lo primero en cada turno. Una operación segura parte por las personas que la hacen posible y por las decisiones que se toman antes de empezar el trabajo.\n\nRevisar los equipos, respetar los procedimientos y avisar a tiempo cuando algo no está bien también es cuidar a tu equipo. Muchas veces los primeros indicios están a la vista: ruidos distintos, vibraciones fuertes o piezas que no funcionan como siempre.\n\nNo esperes a que el problema crezca. Conversar con tu equipo, informar lo que ves y pedir apoyo es parte de trabajar bien.\n\nEn DANK nos sumamos a este día y te invitamos a hacer de la seguridad un hábito en cada turno.\n\nCuídate y cuida a los tuyos.',
  'Todo trabajo debería terminar con las personas de vuelta en casa, sanas y salvas.\n\nHoy, en el Día Mundial de la Seguridad y Salud en el Trabajo, recordamos que cuidar a las personas es parte de cada tarea, desde la planificación hasta la última revisión del equipo.\n\nEn minería e industria se trabaja con equipos pesados, en condiciones exigentes y con turnos largos. Por eso es importante tomarse el tiempo para revisar, preguntar y respetar cada paso del procedimiento, aunque haya apuro.\n\nUna operación continua también es una operación mejor cuidada, donde se detectan a tiempo las señales y se actúa con calma.\n\nTe invitamos a conversar hoy con tu equipo sobre cómo cuidarse mejor en cada turno.\n\nGracias por trabajar con responsabilidad.',
  'La seguridad no es un trámite: se vive todos los días en terreno.\n\nEn el Día Mundial de la Seguridad y Salud en el Trabajo queremos reconocer a quienes cuidan a sus compañeros, respetan cada procedimiento y se atreven a detener una tarea cuando algo no está bien.\n\nDetenerse a tiempo puede evitar un accidente. Hacer una pregunta puede evitar un error. Y avisar de una falla puede evitar un problema mayor.\n\nEn DANK acompañamos a operaciones mineras e industriales, y sabemos que detrás de cada equipo hay personas que merecen volver a casa bien, todos los días.\n\nQue cada turno termine bien.\n\nGracias por trabajar con responsabilidad y por cuidar a tu equipo.']},
 {id:'trab',n:'Día del Trabajo',m:5,d:1,tag:'#DíaDelTrabajo',v:['Hoy, Día del Trabajo, saludamos a quienes trabajan cada día en la minería y en la industria.\n\nDetrás de cada operación hay personas que planifican, mantienen, operan y cuidan los equipos, en cada turno y en cada condición. Son técnicos, operadores, mantenedores, supervisores, ingenieros y equipos de apoyo que trabajan en conjunto para que todo siga funcionando.\n\nSu esfuerzo no siempre se ve, pero se nota en cada resultado, en cada meta cumplida y en cada equipo que vuelve a funcionar a tiempo.\n\nEn DANK valoramos ese trabajo y lo vemos de cerca cada vez que visitamos una operación.\n\nGracias por el esfuerzo y el compromiso de cada día.\n\nFeliz Día del Trabajo.',
  'El 1 de mayo es el Día del Trabajo.\n\nQueremos reconocer a todas las personas que hacen posible que las operaciones sigan funcionando. Hay quienes trabajan en terreno, bajo condiciones exigentes, y quienes apoyan desde la oficina con planificación, compras, logística y administración. Todos son parte de la misma cadena.\n\nEn la industria, un buen resultado nunca es obra de una sola persona. Es fruto del trabajo en equipo, de la experiencia acumulada y de la atención a los detalles.\n\nDesde DANK saludamos a los equipos con los que trabajamos y agradecemos la confianza que nos entregan.\n\nQue hoy tengas un buen día de descanso o un turno tranquilo, si te toca trabajar.\n\nFeliz Día del Trabajo.',
  'Hoy celebramos el trabajo y a quienes lo hacen todos los días.\n\nEn DANK sabemos que una operación continua depende de personas comprometidas, que trabajan en equipo y se ocupan de los detalles. Esa dedicación es la que mantiene los equipos funcionando y las metas al alcance.\n\nTambién sabemos que muchos trabajan hoy en turno, mientras otros descansan. A todos ellos, gracias por mantener las operaciones en marcha.\n\nEs un orgullo acompañar a las personas y a las empresas de esta industria con soluciones que contribuyen a que el trabajo sea más continuo.\n\nGracias por ser parte de la minería y de la industria.\n\nFeliz Día del Trabajo.']},
 {id:'amb',n:'Día Mundial del Medio Ambiente',m:6,d:5,tag:'#MedioAmbiente',v:['Hoy es el Día Mundial del Medio Ambiente.\n\nCuidar el entorno también es parte de la operación. En una correa transportadora, el polvo y los derrames en los puntos de transferencia significan limpieza constante, desgaste de los equipos y más exposición para quienes trabajan cerca.\n\nControlar el polvo ayuda a mantener limpias las áreas de trabajo, a cuidar a las personas y a reducir el impacto en el entorno.\n\nEn DANK somos representantes exclusivos de ScrapeTec en Chile, con el sistema Airscrape, que contribuye a reducir el polvo y los derrames.\n\nSi quieres revisar cómo está tu operación, nuestro equipo técnico puede hacer una evaluación en terreno.\n\nCuidemos el entorno, todos los días.',
  'En el Día Mundial del Medio Ambiente queremos hacer una pregunta: ¿cómo está el polvo en los puntos de transferencia de tus correas transportadoras?\n\nEl polvo y los derrames no solo cuestan limpieza, desgaste y detenciones. También afectan el entorno y a las personas que trabajan cerca de la correa.\n\nCuando el problema se repite, muchas veces se convive con él como si fuera parte normal de la operación. Pero es un problema que se puede evaluar y abordar con una solución adecuada para cada aplicación.\n\nEn DANK acompañamos a las operaciones con evaluación en terreno, selección de la solución y puesta en marcha a cargo de nuestro equipo técnico local.\n\nSi quieres revisar tu caso, escríbenos o llámanos.\n\nUna operación más limpia es una operación más cuidada.',
  'Una operación más limpia es una operación más cuidada.\n\nHoy, Día Mundial del Medio Ambiente, recordamos que reducir el polvo y los derrames en las correas transportadoras es parte de cuidar el entorno y a las personas.\n\nCada punto de transferencia tiene sus propias condiciones: el tipo de material, la velocidad de la correa y el espacio disponible. Por eso no existe una única solución para todos los casos, y es importante evaluar cada aplicación.\n\nEn DANK acompañamos a las operaciones en esa tarea, con evaluación, selección y puesta en marcha de soluciones, y trabajamos con la tecnología Airscrape de ScrapeTec.\n\nTe invitamos a conversar con nuestro equipo técnico y revisar juntos tu operación.\n\nCuidemos el entorno en cada turno.']},
 {id:'minero',n:'Día del Minero',m:8,d:10,tag:'#DíaDelMinero',v:['Hoy es el Día del Minero.\n\nQueremos saludar a las mineras y los mineros que trabajan cada día para que las operaciones no se detengan, en turnos largos, lejos de sus familias y en condiciones exigentes.\n\nSu trabajo es la base de la minería y merece todo nuestro reconocimiento. Gracias a ellos y ellas, Chile tiene una industria clave para el país.\n\nTambién saludamos a quienes los apoyan desde la mantención, la ingeniería, la logística y la administración.\n\nEn DANK es un orgullo acompañar a las operaciones mineras con nuestras soluciones y nuestro equipo técnico.\n\nGracias por el esfuerzo y el compromiso de cada día.\n\nFeliz Día del Minero.',
  'El 10 de agosto celebramos a quienes trabajan en la minería.\n\nDesde DANK saludamos a las personas que operan, mantienen y cuidan los equipos, y también a las familias que los esperan al final de cada turno. Sabemos que el trabajo en minería exige preparación, disciplina y mucho trabajo en equipo.\n\nCada vez que visitamos una operación, vemos de cerca ese compromiso: técnicos y operadores atentos a cada detalle, con la idea de que el equipo siga funcionando y de que todos vuelvan a casa bien.\n\nHoy queremos decirles gracias, por su trabajo y por confiar en nosotros.\n\nFeliz Día del Minero.',
  'Detrás de cada tonelada hay personas.\n\nHoy, Día del Minero, queremos reconocer el trabajo de las mineras y los mineros de Chile, y agradecerles por mantener en marcha una industria clave para el país.\n\nSu trabajo se hace muchas veces de noche, con frío, con calor, en altura y lejos de casa. Y aun así, cada turno se cumple con responsabilidad y con espíritu de equipo.\n\nEn DANK trabajamos para que los equipos de las operaciones funcionen mejor, con soluciones para vibraciones, suspensión y control de polvo. Pero sabemos que nada de eso sería posible sin las personas que hacen su trabajo todos los días.\n\nEs un orgullo acompañarlos.\n\nFeliz Día del Minero.']},
 {id:'patrias',n:'Fiestas Patrias',m:9,d:18,tag:'#FiestasPatrias',v:['Te deseamos unas felices Fiestas Patrias.\n\nLlegó el 18 de septiembre y es un buen momento para pausar, después de un año de mucho trabajo. Que sean días de descanso, de compartir con tu familia, de disfrutar de nuestras tradiciones y de reunirte con quienes más quieres.\n\nDesde DANK saludamos a todos los equipos y las empresas con las que trabajamos, y agradecemos la confianza que nos entregan durante el año.\n\nTambién queremos acordarnos de quienes trabajan en turno durante estos días, para que las operaciones sigan en marcha. Gracias por el compromiso.\n\nCuídate, disfruta y celebra con responsabilidad.\n\nFeliz 18.',
  'Llegó el 18 de septiembre y es momento de pausar.\n\nDesde DANK saludamos a los equipos, a las empresas y a las personas con las que trabajamos. Que estas Fiestas Patrias te permitan descansar, compartir y celebrar con los tuyos, con empanadas, asado y buena compañía.\n\nSabemos que durante el año el ritmo de trabajo es exigente, y por eso estos días son una buena ocasión para renovar energías.\n\nVolveremos con ganas de seguir acompañando a tu operación, con evaluación en terreno, soluciones adecuadas y un equipo técnico cercano.\n\nQue estos días te traigan alegría, buenos recuerdos y mucho descanso.\n\nDisfruta y cuídate.\n\nFelices Fiestas Patrias.',
  'Fiestas Patrias: días para la familia, la mesa grande y las tradiciones.\n\nTe deseamos que las disfrutes con tranquilidad, que descanses y que compartas con las personas que quieres. Después de un año de trabajo, es justo tomarse un respiro.\n\nQueremos mandar un saludo especial a quienes trabajan en turno durante estos días, en faenas y en operaciones, para que todo siga funcionando. Gracias por el compromiso y por cuidar lo que importa.\n\nDesde DANK, un abrazo para cada uno de los equipos con los que trabajamos.\n\nQue sean unos días muy bonitos y que todos vuelvan a casa bien.\n\nFelices Fiestas Patrias.']},
 {id:'navidad',n:'Navidad',m:12,d:25,tag:'#Navidad',v:['Te deseamos una Feliz Navidad.\n\nGracias por confiar en nosotros durante este año. Fue un año de mucho trabajo y queremos agradecerte por cada conversación, cada evaluación y cada proyecto compartido.\n\nTrabajar con operaciones mineras e industriales nos exige estar cerca, escuchar lo que pasa en terreno y buscar soluciones que realmente sirvan. Esa confianza que nos entregas es lo que más valoramos.\n\nEstas fiestas son una buena ocasión para descansar, compartir en familia y renovar energías para lo que viene.\n\nQue tengas una Navidad tranquila y un buen comienzo de año.\n\nNos vemos pronto, con más ganas de acompañar a tu operación.',
  'Llegó la Navidad y queremos saludarte.\n\nDesde DANK agradecemos la confianza de cada persona y cada equipo con el que trabajamos. Sigue siendo un gusto acompañar a las operaciones, desde la primera visita a terreno hasta la puesta en marcha de cada solución.\n\nDurante el año conversamos sobre vibraciones, correas, polvo y continuidad operacional, y aprendimos mucho de lo que pasa día a día en tu operación. Gracias por compartirlo con nosotros.\n\nTe deseamos una Navidad tranquila, con tiempo para descansar y compartir con los tuyos.\n\nQue el próximo año venga con metas cumplidas y operaciones más continuas.\n\nFeliz Navidad.',
  'Cierra el año y es momento de agradecer.\n\nGracias por trabajar con nosotros y por darnos la oportunidad de acompañar a tu operación. Cada proyecto es una oportunidad para aprender y para hacer mejor las cosas, y eso se logra gracias a la confianza de quienes nos reciben en terreno.\n\nPara quienes trabajan estos días en turno, un reconocimiento especial. Gracias por mantener las operaciones en marcha mientras otros descansan.\n\nEn DANK queremos desearte unas fiestas llenas de paz, salud y buenos momentos en familia. Que el próximo año sea un año de oportunidades y de trabajo seguro.\n\nFeliz Navidad y buenas fiestas.']}
];
function fItems(){
  const t=parse(todayISO());
  const all=FECHAS.map(f=>({id:f.id,n:f.n,m:f.m,d:f.d,vers:f.v,tag:f.tag,custom:false})).concat((S.fx||[]).map(x=>{const dt=parse(x.date);return {id:x.id,n:x.n,m:dt.getMonth()+1,d:dt.getDate(),vers:null,tag:'',custom:true};}));
  return all.map(f=>{let dt=new Date(t.getFullYear(),f.m-1,f.d);if(dt<t)dt=new Date(t.getFullYear()+1,f.m-1,f.d);
    const days=Math.round((dt-t)/864e5);const st=S.fechas&&S.fechas[f.id]||{};
    const status=st.status&&st.year===dt.getFullYear()?st.status:'noiniciada';
    return Object.assign(f,{dt,days,year:dt.getFullYear(),status});}).sort((a,b)=>a.days-b.days);
}
function fGen(f){
  if(!f.vers)return '';
  const st=S.fechas&&S.fechas[f.id]||{},b=f.vers[(st.v||0)%f.vers.length];
  return b+'\n\nEquipo DANK\n\n'+[f.tag,'#Minería','#DankChile'].filter(Boolean).join(' ');}
const fText=f=>{const st=S.fechas&&S.fechas[f.id];return st&&st.text!==undefined?st.text:fGen(f);};
const fCount=d=>d===0?'Hoy':d===1?'Mañana':'Faltan '+d+' días';
function updFBadge(){const b=document.getElementById('fbtn');if(!b)return;
  const n=fItems().find(f=>f.status!=='publicada');
  b.innerHTML='Fechas importantes'+(n?'<span class="fbadge" title="'+E(n.n)+'">'+(n.days===0?'hoy':n.days+' d')+'</span>':'');}
const FOPEN=new Set();
function renderFechas(){
  const el=document.getElementById('fechas');if(!el)return;
  const its=fItems();
  el.innerHTML='<div class="fhead"><div><h2>Fechas importantes</h2><p class="hint" style="margin:0">Ordenadas por la más próxima. Presiona una fecha para desplegar su caja y preparar la publicación.</p><div class="fbtns"><button class="btn" type="button" data-act="f-all-open">Desplegar todas</button><button class="btn" type="button" data-act="f-all-close">Contraer todas</button></div></div>'+
   '<div class="fadd"><label>Nueva fecha<input type="text" id="fx-name" placeholder="Nombre de la fecha"></label><label>Día<input type="date" id="fx-date"></label><button class="btn" type="button" data-act="f-add">Agregar fecha</button></div></div>'+
   '<div class="fgrid">'+its.map(f=>{const near=f.days<=14&&f.status!=='publicada';const txt=fText(f);
    const op=FOPEN.has(f.id);
    return '<article class="panel fcard'+(near?' near':'')+(op?' open':'')+'" id="fc-'+f.id+'"><div class="ft" role="button" tabindex="0" data-act="f-open" data-id="'+f.id+'" aria-expanded="'+op+'" aria-controls="fb-'+f.id+'"><div><h3>'+E(f.n)+'</h3><div class="fd">'+E(f.dt.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</div></div>'+
     '<div class="fr"><span class="fst" style="--c:'+stColor(f.status)+'"><i></i>'+STATUS[f.status][0]+'</span><span class="fcount'+(f.days===0?' hoy':near?' near':'')+'">'+fCount(f.days)+'</span><span class="chev" aria-hidden="true"></span></div></div>'+
     '<div class="fbody" id="fb-'+f.id+'"'+(op?'':' hidden')+'>'+
     '<label class="hint" for="ft-'+f.id+'">Texto de la publicación <span id="fn-'+f.id+'">'+txt.length+' / 3000</span></label>'+
     '<textarea id="ft-'+f.id+'" data-act="f-text" data-id="'+f.id+'" placeholder="Escribe aquí la publicación">'+E(txt)+'</textarea>'+
     '<div class="actions"><select data-act="f-status" data-id="'+f.id+'" aria-label="Estado">'+Object.keys(STATUS).map(k=>'<option value="'+k+'"'+(f.status===k?' selected':'')+'>'+STATUS[k][0]+'</option>').join('')+'</select>'+
     (f.custom?'':'<button class="btn" type="button" data-act="f-reset" data-id="'+f.id+'">Generar otra versión</button>')+'<button class="btn" type="button" data-act="f-copy" data-id="'+f.id+'">Copiar texto</button>'+(f.custom?'<button class="btn" type="button" data-act="f-del" data-id="'+f.id+'">Quitar fecha</button>':'')+'</div></div></article>';}).join('')+'</div>';
  fFit();updFBadge();
}
function fFit(id){(id?[document.getElementById('ft-'+id)]:document.querySelectorAll('#fechas textarea[data-act="f-text"]')).forEach(t=>{if(!t)return;t.style.height='auto';t.style.height=Math.max(260,t.scrollHeight+6)+'px';});}
/* Eventos */
const app=document.getElementById('app');
function copyText(text,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1400);};
  const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){btn.textContent='Selecciona y copia a mano';}t.remove();};
  try{navigator.clipboard.writeText(text).then(done,fb);}catch(e){fb();}
}
app.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('.fcard .ft[data-act="f-open"]');if(h&&e.target===h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();h.click();}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;
  if(act==='pdfdel'){deletePdf(id,b.dataset.pid);return;}
  if(act==='f-open'){const c=document.getElementById('fc-'+id),bd=document.getElementById('fb-'+id);if(!c||!bd)return;const o=!FOPEN.has(id);o?FOPEN.add(id):FOPEN.delete(id);c.classList.toggle('open',o);bd.hidden=!o;b.setAttribute('aria-expanded',String(o));if(o)fFit(id);return;}
  if(act==='pdf'){
    const cnt={};ALL.forEach(sl=>{const k=sd(sl.id).status;cnt[k]=(cnt[k]||0)+1;});
    const old=document.getElementById('printroot');if(old)old.remove();
    const r=document.createElement('div');r.id='printroot';
    r.innerHTML='<div class="printhead"><h1>Calendario de la campaña ROSTA / Airscrape · Dank</h1><div>Inicio: '+E(fmtShort(parse(S.start)))+' · Generado: '+E(fmtShort(new Date()))+'</div><div class="lg">'+Object.keys(STATUS).map(k=>'<span><i style="background:'+stColor(k)+'"></i>'+STATUS[k][0]+': '+(cnt[k]||0)+'</span>').join('')+'</div></div>';
    const wrap=document.createElement('section');wrap.className='panel cal-scroll';wrap.style.overflow='visible';
    const c=document.getElementById('cal').cloneNode(true);c.removeAttribute('id');wrap.appendChild(c);r.appendChild(wrap);
    document.body.appendChild(r);document.body.classList.add('pcal');
    const done=()=>{document.body.classList.remove('pcal');r.remove();window.removeEventListener('afterprint',done);};
    window.addEventListener('afterprint',done);
    try{window.print();}catch(e){done();}
    return;
  }
  if(act==='f-all-open'){fItems().forEach(f=>FOPEN.add(f.id));renderFechas();return;}
  if(act==='f-all-close'){FOPEN.clear();renderFechas();return;}
  if(act==='f-toggle'){const el=document.getElementById('fechas');el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));if(!el.hidden){fFit();el.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  if(act==='f-add'){const n=(document.getElementById('fx-name').value||'').trim(),d=document.getElementById('fx-date').value;if(!n||!d)return;S.fx=S.fx||[];S.fx.push({id:'x'+Date.now().toString(36),n,date:d});save();renderFechas();return;}
  if(act==='f-del'){S.fx=(S.fx||[]).filter(x=>x.id!==id);if(S.fechas)delete S.fechas[id];save();renderFechas();return;}
  if(act==='f-reset'){S.fechas=S.fechas||{};const st=S.fechas[id]=S.fechas[id]||{};st.v=(st.v||0)+1;delete st.text;save();renderFechas();return;}
  if(act==='f-copy'){copyText(document.getElementById('ft-'+id).value,b);return;}
  const fb=b.closest('.mixbox');
  if(act==='filtro'||(fb&&!e.target.closest('input'))){const k=b.dataset.k||fb.dataset.k;tipoFilter=tipoFilter===k?'':k;fpage=1;renderMix();renderSlots();const el=document.getElementById('slots');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(act==='fclear'){tipoFilter='';renderMix();renderSlots();return;}
  if(act==='fpage'){fpage=Number(b.dataset.p);renderSlots();const el=document.getElementById('slots');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(act==='week'){tipoFilter='';renderMix();activeWeek=Number(b.dataset.w);renderMain();const el=document.getElementById('slots');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(act==='goto'){tipoFilter='';renderMix();const sl=ALL.find(x=>x.id===id);activeWeek=sl.w;renderMain();const el=document.getElementById('slot-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);}return;}
  if(['regen','regentitle','resetcco','prod','tipo','title','text','cco'].includes(act)&&id&&sd(id).status==='publicada')return;
  if(act==='regen'){const s=ens(id);delete s.text;save();renderMain();return;}
  if(act==='regentitle'){const s=ens(id);s.tv=(s.tv||0)+1;delete s.title;save();const sl=ALL.find(x=>x.id===id),ti=document.getElementById('ti-'+id);if(ti)ti.value=genTitle(sl,sd(id));updCount(id);renderCal();return;}
  if(act==='copy'){const ti=document.getElementById('ti-'+id);copyText((ti&&ti.value?ti.value+'\n\n':'')+document.getElementById('tx-'+id).value,b);return;}
  if(act==='copycco'){copyText(b.closest('details').querySelector('textarea').value,b);return;}
  if(act==='resetcco'){delete ens(id).cco;save();renderSlots();return;}
});
app.addEventListener('change',e=>{
  const t=e.target,act=t.dataset.act,id=t.dataset.id;
  if(act==='pdfup'){const f=t.files&&t.files[0];t.value='';uploadPdf(id,f);return;}
  if(act==='weeks'){S.weeks=Number(t.value);tipoFilter='';save();renderMain();return;}
  if(act==='f-status'){const f=fItems().find(x=>x.id===id);S.fechas=S.fechas||{};S.fechas[id]=Object.assign(S.fechas[id]||{},{status:t.value,year:f?f.year:new Date().getFullYear()});save();renderFechas();return;}
  if(act==='tipo'){ens(id).tipo=t.value;save();renderMix();if(tipoFilter)renderSlots();else refreshTexts();return;}
  if(act==='meta'){S.metas=S.metas||{};S.metas[t.dataset.k]=Math.max(0,Math.min(100,Number(t.value)||0));save();renderMix();return;}
  if(act==='status'){const s=ens(id),sl=ALL.find(x=>x.id===id);
    if(t.value==='publicada'&&s.status!=='publicada'){s.frz={};
      if(s.text===undefined){s.text=mainText(sl,sd(id));s.frz.text=1;}
      if(s.title===undefined){s.title=titleText(sl,sd(id));s.frz.title=1;}
      if(sl.pl==='li'&&s.cco===undefined){s.cco=ccoText(sl,sd(id));s.frz.cco=1;}
    }else if(t.value!=='publicada'&&s.status==='publicada'&&s.frz){Object.keys(s.frz).forEach(k=>delete s[k]);delete s.frz;}
    s.status=t.value;save();renderMain();return;}
  if(act==='prod'){ens(id).prod=t.value;save();renderMain();return;}
  if(act==='ccodone'){ens(id).ccoDone=t.checked;save();renderSlots();return;}
  if(t.id==='cfg-start'&&t.value){S.start=iso(mondayOf(parse(t.value)));t.value=S.start;save();renderMain();return;}
  if(act==='aud'){ens(id).aud=t.value;save();renderMain();return;}
  if(act==='chk'){const s0=ens(id);s0.chk=s0.chk||{};s0.chk[t.dataset.k]=t.checked;save();const d=t.closest('details');const n=d.querySelectorAll('input:checked').length,m=d.querySelectorAll('input').length;d.querySelector('summary').textContent='Antes de publicar · '+n+'/'+m;return;}
});
app.addEventListener('input',e=>{
  const t=e.target,act=t.dataset.act,id=t.dataset.id;
  if(act==='f-text'){S.fechas=S.fechas||{};S.fechas[id]=Object.assign(S.fechas[id]||{},{text:t.value});save();const n=document.getElementById('fn-'+id);if(n)n.textContent=t.value.length+' / 3000';fFit(id);return;}
  if(act==='title'){ens(id).title=t.value;save();updCount(id);renderCal();return;}
  if(act==='text'){const s=ens(id);s.text=t.value;save();updCount(id);return;}
  if(act==='cco'){ens(id).cco=t.value;save();return;}
  if(false&&act==='kpi'){const w=t.dataset.w,f=t.dataset.f;S.kpi[w]=S.kpi[w]||{};S.kpi[w][f]=t.value===''?0:Math.max(0,Number(t.value)||0);save();updKpi();return;}
  if(act==='cfg'){S.products[t.dataset.k][t.dataset.f]=t.value;save();refreshTexts();return;}
  if(act==='contact'){S.contact[t.dataset.f]=t.value;save();refreshTexts();return;}
  if(act==='gs'){S.gs[t.dataset.f]=t.value;save();refreshTexts();return;}
});
/* Al terminar de editar ajustes, refrescar los textos generados */
app.addEventListener('focusout',e=>{
  const t=e.target;
  
  setTimeout(()=>{if(remotePending&&!editing()){const d=remotePending;remotePending=null;applyRemote(d);}},50);
});
app.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.cco')){ens(d.dataset.id).ccoOpen=d.open;}else if(d.matches&&d.matches('details.srcd')){ens(d.dataset.id).srcOpen=d.open;}else if(d.matches&&d.matches('details.chkl')){ens(d.dataset.id).chkOpen=d.open;}},true);

/* Inicio */
(async function init(){
  renderAll();setSync('Cargando…');
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    if(r.status===401){location.href='/login';return;}
    if(!r.ok)throw new Error('estado '+r.status);
    const j=await r.json();
    if(j.data){S=merge(j.data);serverVersion=j.version;setSync('Cargado'+(j.updated_by_email?' · último cambio de '+j.updated_by_email:'')+'.');}
    else{serverVersion=0;setSync('Calendario nuevo. Se guarda en cuanto hagas el primer cambio.');}
    await loadPdfs();renderAll();
  }catch(e){console.error(e);setSync('No se pudo cargar el calendario ('+(e&&e.message?e.message:'error')+'). Recarga la página.');}
  setInterval(poll,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
  const today=todayISO();const hit=ALL.find(sl=>iso(slotDate(sl))>=today&&sd(sl.id).status!=='publicada');
  if(hit&&!S.slots['s1-1']){activeWeek=hit.w;renderMain();}
})();
})();
</script>
</body></html>
